<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Monmusu TD X Wiki</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="layout" class="layout">
  <aside class="side">
    <header class="top">
      <div class="brand-wrap"><button id="menuBtn" class="brand" aria-haspopup="true"><span class="brand-t">Monmusu TD X</span>
        <span id="modeName" class="brand-m"></span><span class="caret">▾</span></button>
        <nav id="menu" class="menu" hidden></nav></div>
      <button id="backBtn" class="reset back" title="Back (Alt+←)" hidden><svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M12 4l-6 6 6 6M6 10h10"/></svg></button>
      <input id="search" type="search" autocomplete="off">
      <span id="count" class="count"></span>
      <button id="listFilterBtn" class="reset lf-btn" hidden><svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 4h14l-5.5 6.5V16l-3 1.5v-7z"/></svg><b id="listFilterCount"></b></button>
      <button id="reset" class="reset"><svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M4.5 8.5A6 6 0 1 1 4 11.5M4.5 3.5v5h5"/></svg></button>
    </header>
    <div id="subFilter" class="subfilter" hidden></div>
    <section class="pane units"><div id="units" class="tiles"></div><div id="subs" class="slist" hidden></div><div id="dungeonList" class="slist" hidden></div>
      <div id="navInfo" class="navinfo" hidden></div></section>
  </aside>
  <section id="detail" class="pane detail"></section>
  <aside id="filters" class="filters">
    <button id="filterBtn" class="filter-btn"><span data-t="filter"></span><b id="filterCount"></b></button>
    <div class="filter-body">
      <div class="fhead"><b data-t="filter"></b>
        <button id="pinBtn" class="pin" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7 2h6l-1 5 3 3v1H5v-1l3-3zM10 11v7"/></svg></button></div>
      <div id="groups"></div>
      <button id="clear" class="btn" data-t="clear"></button>
    </div>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
